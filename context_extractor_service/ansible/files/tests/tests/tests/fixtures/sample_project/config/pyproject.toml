[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "myapp"
version = "1.0.0"
dependencies = [
    "django>=4.0",
    "psycopg2",
]

[tool.myapp]
debug = false
secret_key = "changeme"
database_url = "postgresql://user:pass@localhost:5432/myapp"

[tool.myapp.production]
debug = false
secret_key = "${SECRET_KEY}"
