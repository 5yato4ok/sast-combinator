services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DD_DEBUG: "True"
      DD_SECRET_KEY: "${DD_SECRET_KEY:-insecure-default-key}"
      DD_DATABASE_URL: "postgresql://user:pass@postgres:5432/db"
    volumes:
      - ./src:/app/src
    privileged: true
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-devpassword}"
